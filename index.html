<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stack Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (optional sign-in) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --pink:#FF4FA3; --pink-dk:#C4237A;
    --purple:#8C4CFF; --purple-dk:#5E2ACF;
    --yellow:#FFC93C; --yellow-dk:#E09A00;
    --cyan:#2FE0D9; --cyan-dk:#159E97;
    --green:#3CE67A; --green-dk:#1FA854;
    --card:#241143; --card-2:#341a5e;
    --ink:#2b1350;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0f0f1a; font-family:'Nunito', -apple-system, sans-serif; touch-action: manipulation; }
  #game { display:block; position:fixed; inset:0; width:100%; height:100%; }

  .ui-layer { position:fixed; inset:0; pointer-events:none; z-index:5; }

  .topbar{ position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:14px 14px; pointer-events:none; z-index:6;}
  .topbar-group{ display:flex; align-items:center; gap:8px; pointer-events:all; }
  .pill{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(13px,3.4vw,16px); color:#fff; background:rgba(0,0,0,0.28); padding:7px 14px; border-radius:20px; display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,0.12); }
  .pill.coins{ background:linear-gradient(135deg,var(--yellow),var(--yellow-dk)); color:#3a2400; }

  #muteBtn, #accountBtn{
    pointer-events:all; cursor:pointer; width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.28); color:#fff; border:1px solid rgba(255,255,255,0.12);
    font-size:17px; display:flex; align-items:center; justify-content:center;
  }
  #accountBtn.logged-in{ background:linear-gradient(135deg,var(--cyan),var(--cyan-dk)); font-family:'Baloo 2',sans-serif; font-weight:800; }

  #scoreDisplay {
    position:absolute; top:9%; left:50%; transform:translateX(-50%);
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(36px, 9vw, 64px); font-weight:800; color:#fff;
    text-shadow: 0 3px 12px rgba(0,0,0,0.35);
    letter-spacing:1px;
  }
  #comboDisplay {
    position:absolute; top:25%; left:50%; transform:translateX(-50%) scale(0.8);
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(20px,5vw,32px); font-weight:800; color:#ffd93d;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    opacity:0; transition: transform 0.18s ease-out, opacity 0.18s ease-out;
  }
  #comboDisplay.show { opacity:1; transform:translateX(-50%) scale(1); }

  #toast{
    position:absolute; top:36%; left:50%; transform:translateX(-50%) translateY(10px); width:min(320px,80vw);
    text-align:center; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--pink)); padding:12px 16px; border-radius:16px;
    box-shadow:0 8px 22px rgba(0,0,0,0.4); opacity:0; transition:opacity .25s ease, transform .25s ease; z-index:8;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(15px,4.2vw,19px); color:#fff;
    border:none; padding:14px 30px; border-radius:40px; cursor:pointer; letter-spacing:0.5px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 18px rgba(0,0,0,0.3);
    transition: transform .08s ease, box-shadow .08s ease; pointer-events:all;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25), 0 4px 8px rgba(0,0,0,0.25); }
  .btn-primary{ background:linear-gradient(135deg,var(--pink),var(--purple)); }
  .btn-shop{ background:linear-gradient(135deg,var(--yellow),var(--yellow-dk)); color:#3a2400; box-shadow:0 6px 0 var(--yellow-dk), 0 10px 18px rgba(0,0,0,0.3);}
  .btn-ghost{ background:rgba(255,255,255,0.14); box-shadow:0 6px 0 rgba(0,0,0,0.18), 0 10px 18px rgba(0,0,0,0.25); font-size:clamp(13px,3.6vw,15px); padding:10px 22px; }
  .btn-small{ padding:9px 18px; font-size:14px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:all;
    background: radial-gradient(circle at 50% 30%, rgba(30,16,56,0.7), rgba(10,10,20,0.9));
    text-align:center; padding:20px; opacity:0; transition:opacity 0.35s ease; z-index:20;
  }
  .overlay.visible { opacity:1; }
  .overlay.hidden { display:none; }
  .title {
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(38px,10vw,68px); font-weight:800; color:#fff; margin-bottom:8px;
    background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c56bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .subtitle { font-size:clamp(14px,4vw,18px); color:rgba(255,255,255,0.8); margin-bottom:26px; max-width:320px; font-weight:600; }

  .go-score { font-family:'Baloo 2',sans-serif; font-size:clamp(48px,12vw,80px); font-weight:800; color:#fff; margin:6px 0 2px; }
  .go-label { font-size:14px; color:rgba(255,255,255,0.65); letter-spacing:2px; text-transform:uppercase; font-weight:700;}
  .go-best { font-size:16px; color:#ffd93d; font-weight:800; margin-top:8px; }
  .go-coins { font-size:16px; color:#ffe08a; font-weight:800; margin-top:4px; margin-bottom:22px; }
  .newbest { animation: glow 1s infinite alternate; }
  @keyframes glow { from{ text-shadow:0 0 6px #ffd93d;} to{ text-shadow:0 0 20px #ffd93d,0 0 30px #ff6b6b; } }

  /* ---------- modal (shop / account) ---------- */
  .modal-overlay{
    position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(6,4,16,0.6); pointer-events:all; opacity:0; transition:opacity .25s ease; z-index:30;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-overlay.visible{ opacity:1; }
  .modal{
    width:100%; max-width:460px; max-height:82vh; overflow-y:auto;
    background:linear-gradient(180deg,var(--card-2),var(--card));
    border-radius:26px 26px 0 0; padding:22px 20px 30px; box-shadow:0 -10px 40px rgba(0,0,0,0.5);
    transform:translateY(12px); transition:transform .25s ease;
  }
  .modal-overlay.visible .modal{ transform:translateY(0); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-title{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:22px; color:#fff; }
  .modal-close{ pointer-events:all; cursor:pointer; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; border:none; font-size:16px; }

  .skin-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .skin-card{ background:rgba(255,255,255,0.06); border-radius:16px; padding:12px; text-align:center; border:2px solid transparent; }
  .skin-card.active{ border-color:var(--green); }
  .skin-swatch{ width:100%; height:44px; border-radius:10px; margin-bottom:8px; display:flex; overflow:hidden; }
  .skin-swatch span{ flex:1; }
  .skin-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; color:#fff; margin-bottom:8px; }
  .skin-req{ font-size:11px; color:rgba(255,255,255,0.55); margin-top:4px; font-weight:700;}

  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{ flex:1; padding:10px; border-radius:14px; border:none; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; color:rgba(255,255,255,0.6); background:rgba(255,255,255,0.06); cursor:pointer; pointer-events:all; }
  .tab-btn.active{ color:#fff; background:linear-gradient(135deg,var(--purple),var(--pink)); }

  .field{ margin-bottom:12px; text-align:left; }
  .field label{ display:block; font-size:12px; font-weight:700; color:rgba(255,255,255,0.6); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px;}
  .field input{
    width:100%; padding:12px 14px; border-radius:12px; border:none; background:rgba(255,255,255,0.08);
    color:#fff; font-size:15px; font-family:'Nunito',sans-serif; font-weight:700; outline:none; pointer-events:all;
  }
  .field input::placeholder{ color:rgba(255,255,255,0.35); }
  .form-error{ color:#ff8080; font-size:13px; font-weight:700; margin-bottom:10px; min-height:16px; }
  .account-row{ display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); border-radius:16px; padding:14px; margin-bottom:14px; }
  .avatar{ width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--purple)); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; color:#fff; font-size:18px; }
  .account-stats{ display:flex; gap:16px; }
  .account-stat{ text-align:center; }
  .account-stat b{ display:block; font-family:'Baloo 2',sans-serif; font-size:18px; color:#fff; }
  .account-stat span{ font-size:11px; color:rgba(255,255,255,0.55); font-weight:700; }
  .guest-note{ font-size:12px; color:rgba(255,255,255,0.5); margin-top:14px; line-height:1.5; font-weight:600; }

  .diff-btn{ pointer-events:all; cursor:pointer; border:none; padding:9px 18px; border-radius:30px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:rgba(255,255,255,0.65); background:rgba(255,255,255,0.08); }
  .diff-btn.active{ color:#fff; }
  .diff-btn.active.easy{ background:linear-gradient(135deg,var(--green),var(--green-dk)); }
  .diff-btn.active.normal{ background:linear-gradient(135deg,var(--cyan),var(--cyan-dk)); }
  .diff-btn.active.hard{ background:linear-gradient(135deg,var(--pink),var(--pink-dk)); }

  .btn-google{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#3c4043; box-shadow:0 6px 0 #c8c8c8, 0 10px 18px rgba(0,0,0,0.25);
    font-size:15px;
  }
  .btn-google svg{ width:19px; height:19px; flex-shrink:0; }
  .divider{ display:flex; align-items:center; gap:10px; margin:14px 0; color:rgba(255,255,255,0.4); font-size:12px; font-weight:700; letter-spacing:0.5px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,0.15); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="ui-layer">
  <div class="topbar">
    <div class="topbar-group">
      <button id="muteBtn">🔊</button>
      <div class="pill coins">🪙 <span id="coinsDisplay">0</span></div>
    </div>
    <div class="topbar-group">
      <div class="pill">🏆 <span id="highScoreDisplay">0</span></div>
      <button id="accountBtn">👤</button>
    </div>
  </div>
  <div id="scoreDisplay">0</div>
  <div id="comboDisplay">COMBO x2</div>
  <div id="toast"></div>
</div>

<div id="startOverlay" class="overlay visible">
  <div class="title">STACK TOWER</div>
  <div class="subtitle">Tap to drop the block. Line it up perfectly to keep your streak alive and earn coins!</div>
  <div class="btn-row" id="difficultyRow" style="margin-bottom:18px;"></div>
  <div class="btn-row" style="flex-direction:column; align-items:center;">
    <button class="btn btn-primary" id="playBtn">▶ PLAY</button>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-shop btn-small" id="shopBtnStart">🛍 SHOP</button>
      <button class="btn btn-ghost" id="accountBtnStart">👤 ACCOUNT</button>
    </div>
  </div>
</div>

<div id="gameOverOverlay" class="overlay hidden">
  <div class="go-label">Score</div>
  <div class="go-score" id="finalScore">0</div>
  <div class="go-best" id="bestLabel">Best: 0</div>
  <div class="go-coins" id="coinsEarnedLabel">+0 🪙</div>
  <div class="btn-row" style="flex-direction:column; align-items:center;">
    <button class="btn btn-primary" id="retryBtn">↻ RETRY</button>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-shop btn-small" id="shopBtnGO">🛍 SHOP</button>
      <button class="btn btn-ghost" id="homeBtnGO">🏠 HOME</button>
    </div>
  </div>
</div>

<!-- SHOP MODAL -->
<div id="shopModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🛍 Skin Shop</div>
      <button class="modal-close" id="shopClose">✕</button>
    </div>
    <div class="skin-grid" id="skinGrid"></div>
  </div>
</div>

<!-- ACCOUNT MODAL -->
<div id="accountModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="accountModalTitle">👤 Account</div>
      <button class="modal-close" id="accountClose">✕</button>
    </div>
    <div id="accountBody"></div>
  </div>
</div>

<script>
  // Optional Firebase sign-in — game works fully without it (guest mode).
  const firebaseConfig = {
    apiKey: "AIzaSyBorOD0CY29eTBmS5Mc4zmws_pUDr2aYHM",
    authDomain: "stack-tower-baba.firebaseapp.com",
    projectId: "stack-tower-baba",
    storageBucket: "stack-tower-baba.firebasestorage.app",
    messagingSenderId: "403888860173",
    appId: "1:403888860173:web:25ecd02f7fad633c66b944"
  };
  firebase.initializeApp(firebaseConfig);
</script>

<script>
(function(){
  "use strict";

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    // Read the canvas's ACTUAL on-screen box (CSS already sizes it to 100%/100%)
    // instead of window.innerWidth/innerHeight, which can report a stale value
    // on first paint on some mobile browsers and lock the canvas at the wrong size.
    const rect = canvas.getBoundingClientRect();
    W = Math.round(rect.width) || window.innerWidth;
    H = Math.round(rect.height) || window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', ()=>{ resize(); generateStars(); });
  window.addEventListener('orientationchange', ()=>{ resize(); generateStars(); });
  resize();
  // Re-check shortly after load in case mobile browser chrome (address bar, etc.)
  // was still settling when the first measurement happened.
  window.addEventListener('load', ()=>{ setTimeout(()=>{ resize(); generateStars(); }, 200); });

  // ---------- Audio (synth, no files needed) ----------
  let actx = null, muted = false;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function tone(freq, dur, type, vol, delay){
    if(muted || !actx) return;
    const t0 = actx.currentTime + (delay||0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function sfxPlace(){ tone(220,0.09,'square',0.12); }
  function sfxPerfect(combo){
    const base = 440 + Math.min(combo,10)*40;
    tone(base,0.1,'triangle',0.16);
    tone(base*1.5,0.12,'triangle',0.12,0.04);
  }
  function sfxGameOver(){ tone(180,0.25,'sawtooth',0.14); tone(120,0.35,'sawtooth',0.12,0.08); }
  function sfxStart(){ tone(523,0.08,'sine',0.14); tone(659,0.1,'sine',0.14,0.07); }
  function sfxCoin(){ tone(880,0.07,'square',0.1); tone(1180,0.09,'square',0.08,0.05); }

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // =========================================================
  // ACCOUNTS / PROFILE
  // Sign-in is optional. Firebase Authentication handles real
  // accounts (email + password); anyone who doesn't sign in plays
  // as an auto-numbered guest (guest-1, guest-2, ...). Profile
  // stats (score, coins, skins) are saved in THIS browser's storage
  // keyed by account id — Firebase here only proves identity, it
  // doesn't yet sync scores across devices (that needs Firestore).
  // =========================================================
  const PROFILES_KEY = 'stackTowerProfiles';
  const GUEST_COUNTER_KEY = 'stackTowerGuestCounter';
  const GUEST_SESSION_KEY = 'stackTowerGuestSession';

  function loadAllProfiles(){ try{ return JSON.parse(localStorage.getItem(PROFILES_KEY) || '{}'); }catch(e){ return {}; } }
  function saveAllProfiles(all){ try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(all)); }catch(e){} }

  function defaultProfile(){ return { highScores:{easy:0,normal:0,hard:0}, coins:0, unlocked:['classic'], skin:'classic', difficulty:'normal' }; }
  function normalizeProfile(p){
    if(!p.highScores){
      const legacy = p.highScore || 0;
      p.highScores = { easy:0, normal:legacy, hard:0 };
    }
    ['easy','normal','hard'].forEach(k=>{ if(typeof p.highScores[k] !== 'number') p.highScores[k] = 0; });
    delete p.highScore;
    return p;
  }
  function bestOverall(){ return Math.max(profile.highScores.easy, profile.highScores.normal, profile.highScores.hard); }

  function nextGuestName(){
    let n = parseInt(localStorage.getItem(GUEST_COUNTER_KEY) || '0', 10) + 1;
    try{ localStorage.setItem(GUEST_COUNTER_KEY, String(n)); }catch(e){}
    return 'guest-' + n;
  }
  function getGuestIdentity(){
    let name = null;
    try{ name = sessionStorage.getItem(GUEST_SESSION_KEY); }catch(e){}
    if(!name){
      name = nextGuestName();
      try{ sessionStorage.setItem(GUEST_SESSION_KEY, name); }catch(e){}
    }
    return { kind:'guest', id:name, label:name };
  }

  let identity = getGuestIdentity(); // { kind:'guest'|'firebase', id, label }
  let profile = normalizeProfile(Object.assign(defaultProfile(), loadAllProfiles()[identity.id] || {}));

  function setIdentity(next){
    identity = next;
    const all = loadAllProfiles();
    profile = normalizeProfile(Object.assign(defaultProfile(), all[identity.id] || {}));
  }
  function saveProfile(){
    const all = loadAllProfiles();
    all[identity.id] = profile;
    saveAllProfiles(all);
  }

  function friendlyAuthError(err){
    const map = {
      'auth/email-already-in-use': 'That email is already registered',
      'auth/invalid-email': "That email doesn't look right",
      'auth/weak-password': 'Password needs 6+ characters',
      'auth/user-not-found': 'No account with that email',
      'auth/wrong-password': 'Wrong email or password',
      'auth/invalid-credential': 'Wrong email or password',
      'auth/too-many-requests': 'Too many tries — wait a bit and retry',
      'auth/popup-closed-by-user': 'Google sign-in was closed before finishing',
      'auth/cancelled-popup-request': 'Google sign-in was cancelled',
      'auth/popup-blocked': 'Your browser blocked the Google sign-in popup — allow popups and try again',
      'auth/account-exists-with-different-credential': 'That email is already used with a different sign-in method',
    };
    return map[err.code] || err.message;
  }
  function signUp(email, password){ return firebase.auth().createUserWithEmailAndPassword(email.trim(), password); }
  function logIn(email, password){ return firebase.auth().signInWithEmailAndPassword(email.trim(), password); }
  function signInWithGoogle(){ return firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  function logOut(){
    try{ sessionStorage.removeItem(GUEST_SESSION_KEY); }catch(e){} // next guest gets a fresh number
    firebase.auth().signOut();
  }

  firebase.auth().onAuthStateChanged(function(user){
    if(user){ setIdentity({ kind:'firebase', id:user.uid, label:user.email }); }
    else { setIdentity(getGuestIdentity()); }
    renderTopbar();
    if(accountModal && !accountModal.classList.contains('hidden')) renderAccount();
  });

  // =========================================================
  // DIFFICULTY PRESETS
  // =========================================================
  const DIFFICULTIES = {
    easy:   { label:'EASY',   baseSpeed:1.5, stepEvery:6, step:0.14, maxSpeed:4.5, perfectTol:9 },
    normal: { label:'NORMAL', baseSpeed:1.9, stepEvery:5, step:0.18, maxSpeed:6,   perfectTol:6 },
    hard:   { label:'HARD',   baseSpeed:2.6, stepEvery:4, step:0.26, maxSpeed:8.5, perfectTol:4 },
  };
  function diff(){ return DIFFICULTIES[profile.difficulty] || DIFFICULTIES.normal; }

  // =========================================================
  // SKINS / SHOP
  // =========================================================
  const SKINS = [
    { id:'classic', name:'Classic Rainbow', unlock:{type:'free'},
      gen:(layer)=> `hsl(${(layer*18)%360},72%,58%)` },
    { id:'neon', name:'Neon Nights', unlock:{type:'score', value:20},
      gen:(layer)=> `hsl(${(layer*35)%360},95%,62%)` },
    { id:'candy', name:'Candy Pop', unlock:{type:'score', value:40},

  function isMobile(){ return window.innerWidth <= 700; }

  // ---------- Game constants ----------
  let BLOCK_H = isMobile() ? 27 : 34;
  window.addEventListener('resize', ()=>{ BLOCK_H = isMobile() ? 27 : 34; });
  const MIN_WIDTH_GAMEOVER = 4;

  // ---------- State ----------
  let state = 'start'; // 'start' | 'playing' | 'gameover'
  let blocks = [];      // stacked blocks {x,width,color,layer}
  let moving = null;    // current moving block
  let debris = [];      // falling cut pieces
  let particles = [];   // perfect burst particles
  let score = 0;
  let combo = 0;
  let camY = 0;          // smoothed camera offset
  let camTargetY = 0;
  let shake = 0;
  let lastTime = 0;

  // ---------- Night sky starfield ----------
  // Two depths: tiny "back" stars drift down faster, small "front" stars drift down slower.
  let backStars = [], frontStars = [];
  let starFieldH = 800;
  const BACK_PARALLAX = 0.55;   // very small stars — move faster
  const FRONT_PARALLAX = 0.16;  // small stars — move slower
  function generateStars(){
    starFieldH = H;
    const backCount = Math.round((W*H)/9000);
    const frontCount = Math.round((W*H)/16000);
    backStars = []; frontStars = [];
    for(let i=0;i<backCount;i++){
      backStars.push({ x:Math.random()*W, y:Math.random()*starFieldH, r:0.4+Math.random()*0.7, phase:Math.random()*Math.PI*2, tw:0.6+Math.random()*0.9 });
    }
    for(let i=0;i<frontCount;i++){
      frontStars.push({ x:Math.random()*W, y:Math.random()*starFieldH, r:1.2+Math.random()*1.2, phase:Math.random()*Math.PI*2, tw:0.5+Math.random()*0.7 });
    }
  }
  generateStars();

  function resetGame(){
    const startWidth = isMobile() ? Math.min(W * 0.42, 190) : Math.min(W * 0.55, 260);
    blocks = [{ x: W/2 - startWidth/2, width: startWidth, color: colorForLayer(0), layer: 0 }];
    debris = [];
    particles = [];
    score = 0;
    combo = 0;
    camY = 0; camTargetY = 0; shake = 0;
    spawnMoving();
    updateScoreUI();
  }

  function currentSpeed(){
    const d = diff();
    const steps = Math.floor(score / d.stepEvery);
    return Math.min(d.baseSpeed + steps * d.step, d.maxSpeed);
  }

  function spawnMoving(){
    const top = blocks[blocks.length-1];
    const layer = top.layer + 1;
    const width = top.width;
    moving = { width, color: colorForLayer(layer), layer, speed: currentSpeed() };
    moving.phase = Math.random() * Math.PI * 2;
    moving.baseX = W/2 - width/2;
    moving.amp = Math.max(10, (W - width)/2);
  }

  function layerScreenY(layer){
    return H - (layer+1)*BLOCK_H + camY;
  }

  function updateScoreUI(){
    document.getElementById('scoreDisplay').textContent = score;
  }

  function showCombo(mult){
    const el = document.getElementById('comboDisplay');
    el.textContent = 'PERFECT x' + mult;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(showCombo._t);
    showCombo._t = setTimeout(()=> el.classList.remove('show'), 650);
  }

  function spawnParticles(x, y, color, count){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 1.5 + Math.random()*3.5;
      particles.push({
        x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 1.5,
        life: 1, color, size: 2+Math.random()*3
      });
    }
  }

  function startGame(){
    ensureAudio();
    state = 'playing';

    setTimeout(()=>document.getElementById('startOverlay').classList.add('hidden'), 350);
    sfxStart();
    resetGame();
  }

  function drop(){
    if(state !== 'playing') return;
    ensureAudio();
    const top = blocks[blocks.length-1];
    const mx = moving.baseX + Math.sin(moving.phase) * moving.amp;
    const left = Math.max(mx, top.x);
    const right = Math.min(mx + moving.width, top.x + top.width);
    const overlap = right - left;

    if(overlap <= 0){
      return triggerGameOver();
    }

    const centerDiff = Math.abs((mx + moving.width/2) - (top.x + top.width/2));
    const isPerfect = centerDiff < diff().perfectTol && overlap > top.width - diff().perfectTol*2;

    let newBlock;
    if(isPerfect){
      combo++;
      newBlock = { x: top.x, width: top.width, color: colorForLayer(moving.layer), layer: moving.layer };
      shake = Math.min(shake + 4, 10);
      spawnParticles(W/2, layerScreenY(moving.layer)+BLOCK_H/2, newBlock.color, 18);
      showCombo(Math.min(combo+1, 99));
      sfxPerfect(combo);
      score += 1 + Math.min(combo, 5);
    } else {
      combo = 0;
      newBlock = { x: left, width: overlap, color: colorForLayer(moving.layer), layer: moving.layer };
      if(mx < left){
        debris.push(makeDebris(mx, layerScreenY(moving.layer), left-mx, newBlock.color, -1));
      }
      if(mx+moving.width > right){
        debris.push(makeDebris(right, layerScreenY(moving.layer), (mx+moving.width)-right, newBlock.color, 1));
      }
      sfxPlace();
      score += 1;
    }

    if(newBlock.width < MIN_WIDTH_GAMEOVER){
      blocks.push(newBlock);
      return triggerGameOver();
    }

    blocks.push(newBlock);
    updateScoreUI();

    const visibleLayers = H / BLOCK_H;
    if(blocks.length > visibleLayers * 0.55){
      const wanted = (blocks.length - visibleLayers*0.55) * BLOCK_H;
      camTargetY = Math.max(camTargetY, wanted); // camera only ever climbs, never drops back
    }

    spawnMoving();
  }

  function makeDebris(x, y, width, color, dir){
    return {
      x, y, width, height: BLOCK_H, color,
      vx: dir * (1.5 + Math.random()*1.5),
      vy: -2 - Math.random()*1.5,
      rot: 0, vrot: dir * (0.08 + Math.random()*0.08),
      life: 1
    };
  }

  function triggerGameOver(){
    state = 'gameover';

    shake = Math.min(shake + 8, 14);

    const d = profile.difficulty;
    const prevBest = profile.highScores[d] || 0;
    const isNew = score > prevBest;

    setTimeout(sfxCoin, 200);

  // ---------- Render loop ----------
  function drawBackground(t){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#05060f');
    g.addColorStop(1, '#0b0f2e');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    drawStarLayer(backStars, BACK_PARALLAX, t);
    drawStarLayer(frontStars, FRONT_PARALLAX, t);
  }

  function drawStarLayer(stars, parallax, t){
    for(const s of stars){
      let y = (s.y + camY*parallax) % starFieldH;
      if(y < 0) y += starFieldH;
      const twinkle = 0.55 + 0.45*Math.sin((t||0)*0.001*s.tw + s.phase);
      ctx.globalAlpha = Math.max(0.15, twinkle);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function roundRectPath(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawBlock(x,y,w,h,color){
    const r = Math.min(7, h/3, w/3);
    ctx.save();
    roundRectPath(x, y, w, h, r);
    ctx.clip();

    // base cartoony fill
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);

    // glossy top highlight
    const gloss = ctx.createLinearGradient(0, y, 0, y+h*0.55);
    gloss.addColorStop(0, 'rgba(255,255,255,0.42)');
    gloss.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gloss;
    ctx.fillRect(x, y, w, h*0.55);

    // bottom shade for chunky 3D feel
    const shade = ctx.createLinearGradient(0, y+h*0.55, 0, y+h);
    shade.addColorStop(0, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = shade;
    ctx.fillRect(x, y+h*0.55, w, h*0.45);

    // right edge bevel
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.fillRect(x+w-Math.min(5,w*0.12), y, Math.min(5,w*0.12), h);
    // left edge tiny highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x, y, Math.min(3,w*0.08), h);

    ctx.restore();

    // outline
    ctx.save();
    roundRectPath(x, y, w, h, r);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.32)';
    ctx.stroke();
    ctx.restore();
  }

  function frame(t){
    const dt = Math.min((t - lastTime)/16.67, 3) || 1;
    lastTime = t;

    camY += (camTargetY - camY) * 0.12;
    shake *= 0.85;
    const sx = (Math.random()-0.5)*shake;
    const sy = (Math.random()-0.5)*shake;

    ctx.save();
    drawBackground(t);
    ctx.translate(sx, sy);

    for(const b of blocks){
      const y = layerScreenY(b.layer);
      if(y > H+BLOCK_H || y < -BLOCK_H) continue;
      drawBlock(b.x, y, b.width, BLOCK_H, b.color);
    }

    if(state === 'playing' && moving){
      moving.phase += 0.028 * moving.speed * dt;
      const mx = moving.baseX + Math.sin(moving.phase) * moving.amp;
      const y = layerScreenY(moving.layer);
      drawBlock(mx, y, moving.width, BLOCK_H, moving.color);
      moving._drawX = mx; moving._drawY = y;
    }

    for(let i=debris.length-1;i>=0;i--){
      const d = debris[i];
      d.vy += 0.35*dt;
      d.x += d.vx*dt; d.y += d.vy*dt; d.rot += d.vrot*dt;
      d.life -= 0.012*dt;
      if(d.life <= 0 || d.y > H+100){ debris.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(d.life,0);
      ctx.translate(d.x + d.width/2, d.y + d.height/2);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.width/2, -d.height/2, d.width, d.height);
      ctx.restore();
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += 0.12*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.life -= 0.025*dt;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
